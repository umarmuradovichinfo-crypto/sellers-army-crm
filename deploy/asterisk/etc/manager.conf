; AMI: CRM ilovasi shu orqali qo'ng'iroq boshlaydi va CDR hodisalarini oladi. Parol — ASTERISK_AMI_SECRET (entrypoint almashtiradi).
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[crm]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.16.0.0/255.240.0.0
; `user` — dialplan UserEvent (CrmRing: kiruvchi oyna, CrmRate: sifat bahosi); busiz bu hodisalar CRM'ga kelmaydi
read = system,call,cdr,reporting,user
write = system,call,originate,command
