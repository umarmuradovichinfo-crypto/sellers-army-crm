; Asterisk jurnallari (/var/log/asterisk — compose'da asterisk-data/log ga ulangan).
; security.log — SIP autentifikatsiya hodisalari (InvalidPassword, ChallengeResponseFailed, InvalidAccountID, …):
; fail2ban (deploy/fail2ban/filter.d/asterisk-crm.conf) shu faylni kuzatib, parol tanlovchi IP'larni bloklaydi.
[general]
dateformat = %F %T
rotatestrategy = rotate

[logfiles]
console => notice,warning,error
messages.log => notice,warning,error
security.log => security
