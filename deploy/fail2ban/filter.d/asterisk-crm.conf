# fail2ban filtri: Asterisk (PJSIP) security.log — parol tanlash / mavjud bo'lmagan raqam / ACL rad etilishi.
# Manba: deploy/asterisk/etc/logger.conf → `security.log => security` (konteyner /var/log/asterisk → deploy/asterisk-data/log).
# Namuna (Asterisk 23.5, noto'g'ri parol bilan REGISTER, jonli konteynerdan olingan):
#   [2026-10-28 12:46:17] SECURITY[110] res_security_log.c: SecurityEvent="ChallengeResponseFailed",EventTV="2026-10-28T12:46:17.897+0000",Severity="Error",Service="PJSIP",EventVersion="1",AccountID="100",SessionID="286f40b8e93f635e",LocalAddress="IPV4/UDP/172.17.0.2/5060",RemoteAddress="IPV4/UDP/127.0.0.1/5095",Challenge="1793191577/765387e5bb6db4126326a61e3285a917",Response="dee2332b842c241130fe4389905b7b49",ExpectedResponse=""
# Diqqat: Asterisk 23 da ChallengeResponseFailed oxirida `Response=`/`ExpectedResponse=` bor — eski filtrlar (ReceivedHash=… $) buni tutmaydi.
# Faqat Service="PJSIP" (AMI xatolari — CRM konteyneri IP'si, bloklanmaydi) va faqat UDP/TCP/TLS: brauzer telefoni (WS) Caddy orqali keladi — RemoteAddress Caddy konteyneri IP'si bo'ladi; uni bloklash hamma brauzer
# telefonlarini o'chirib qo'yadi (WSS himoyasi — Caddy darajasida).
# Sinash (serverda): fail2ban-regex /opt/crm/deploy/asterisk-data/log/security.log /etc/fail2ban/filter.d/asterisk-crm.conf

[INCLUDES]
before = common.conf

[Definition]
_daemon = asterisk
__pid_re = (?:\s*\[\d+\])
log_prefix = SECURITY%(__pid_re)s:? [^:]+:\d*
prefregex = ^%(__prefix_line)s%(log_prefix)s <F-CONTENT>.+</F-CONTENT>$
failregex = ^(?=[^\n]*,Service="PJSIP",)SecurityEvent="(?:FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword)"(?:,(?!RemoteAddress=)\w+="[^"]*")*,RemoteAddress="IPV[46]/(?:UDP|TCP|TLS)/<HOST>/\d+"(?:,\w+="[^"]*")*$
ignoreregex =
datepattern = {^LN-BEG}
