# Umumiy qism: bitta Postgres + Caddy (avtomatik HTTPS). Har mijoz alohida konteyner (customers/<nom>/compose.yml).
# Ishga tushirish: cd deploy && docker compose --env-file .env up -d
name: crm-core
services:
  postgres:
    image: postgres:16
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [crm-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # internetga CHIQARILMAYDI (ports yo'q) — faqat crm-net ichida
    shm_size: 256mb

  caddy:
    image: caddy:2
    container_name: crm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL kerak}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [crm-net]

  # O'z stansiyamiz (faqat `--profile pbx` bilan ishga tushadi). Haqiqiy serverda hali sinalmagan — deploy/asterisk/README.md ga qarang.
  asterisk:
    image: andrius/asterisk:latest
    profiles: ["pbx"]
    container_name: asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./asterisk-data/etc:/etc/asterisk
      - ./asterisk-data/sounds/custom:/var/lib/asterisk/sounds/custom # CRM ASTERISK_SOUNDS_DIR/custom/<id> ga yozadi
      - ./asterisk-data/recordings:/var/spool/asterisk/monitor
    networks: [crm-net]

networks:
  crm-net:
    name: crm-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
