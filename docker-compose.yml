# Ishga tushirish:
#   cp .env.example .env   # JWT_*_SECRET va SEED_ADMIN_PASSWORD ni to'ldiring
#   docker compose up --build
# So'ng http://localhost:8000 (login: SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose ichida baza manzili avtomatik (.env dagi DATABASE_URL ustidan yozadi)
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
